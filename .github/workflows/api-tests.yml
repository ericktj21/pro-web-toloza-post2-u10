name: Newman API Tests
on: [push]
jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compilar aplicación (sin tests)
        run: mvn -B -DskipTests package

      - name: Iniciar aplicación (background)
        run: |
          java -jar target/*.jar &
          # Esperar /actuator/health hasta 60s
          for i in {1..12}; do
            if curl -sSf http://localhost:8080/actuator/health >/dev/null; then
              echo "App lista"
              break
            fi
            echo "Esperando app... ($i)"
            sleep 5
          done

      - name: Instalar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Instalar Newman
        run: npm ci -g newman || npm install -g newman

      - name: Ejecutar pruebas de API con Newman
        run: |
          ls -la postman || true
          newman run postman/ColeccionToDo.json -e postman/env-ci.json --timeout-request 60000 --delay-request 200
name: Newman API Tests
on: [push]
jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17' # Usa la versión de Java de tu proyecto

      - name: Iniciar Spring Boot
        run: |
          mvn spring-boot:run &
          sleep 25 # Espera 25 segundos para que el servidor arranque por completo

      - name: Instalar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Instalar Newman
        run: npm install -g newman

      - name: Ejecutar pruebas de API con Newman
        run: newman run postman/Tarea-API-Erick.json